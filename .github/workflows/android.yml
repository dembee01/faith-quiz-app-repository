name: Android quality checks

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate questions and unit tests
        run: ./gradlew testDebugUnitTest --stacktrace
      - name: Compile Android instrumentation tests
        run: ./gradlew compileDebugAndroidTestKotlin --stacktrace
      - name: Run Android lint
        run: ./gradlew lintDebug --stacktrace
      - name: Compile release sources
        run: ./gradlew compileReleaseKotlin --stacktrace
